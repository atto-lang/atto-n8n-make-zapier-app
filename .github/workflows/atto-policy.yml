name: Current Atto workflow policy guest
on:
  pull_request:
    paths:
      - 'src/domain.ores'
      - 'tests/atto/**'
      - 'scripts/test-atto-policy.sh'
      - '.github/workflows/atto-policy.yml'
  push:
    branches: [main, test/durable-effect-sequence-fence-20261105]
    paths:
      - 'src/domain.ores'
      - 'tests/atto/**'
      - 'scripts/test-atto-policy.sh'
      - '.github/workflows/atto-policy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned public Atto compiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/atto-lang/atto-source.java.git "$RUNNER_TEMP/atto-java"
          git -C "$RUNNER_TEMP/atto-java" checkout --detach b02efee4c036557278284ca444655e19cd0adc64
          test "$(git -C "$RUNNER_TEMP/atto-java" rev-parse 'HEAD^{tree}')" = "018f14281cb7af30c862c0dd25e1edc364148ca0"
          cd "$RUNNER_TEMP/atto-java"
          mvn -B -ntp -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Execute pure policy with current Atto syntax
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "APP_HEAD=$EXPECTED_HEAD APP_TREE=$(git rev-parse 'HEAD^{tree}')"
          ATTO_COMPILER_DIR="$RUNNER_TEMP/atto-java" ./scripts/test-atto-policy.sh
